name: CLI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version. Defaults to current ref name.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT:-${GITHUB_REF_NAME}}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: dotnet test modules/tests/Municloud.Cli.Tests/Municloud.Cli.Tests.csproj --configuration Release

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish modules/cli/Municloud.Cli.csproj \
            --configuration Release \
            --runtime "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version="${VERSION}" \
            --output "artifacts/municloud-${RID}"

          if [[ "${RID}" == win-* ]]; then
            mv "artifacts/municloud-${RID}/Municloud.Cli.exe" "artifacts/municloud-${RID}/municloud.exe"
          else
            mv "artifacts/municloud-${RID}/Municloud.Cli" "artifacts/municloud-${RID}/municloud"
            chmod +x "artifacts/municloud-${RID}/municloud"
          fi

      - name: Archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "artifacts/municloud-${RID}" && zip -r "../../dist/municloud-${RID}.zip" .)
          else
            tar -czf "dist/municloud-${RID}.tar.gz" -C "artifacts/municloud-${RID}" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: municloud-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add checksums and installers
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum municloud-* > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
