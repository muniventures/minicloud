name: CLI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version. Defaults to current ref name.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_INPUT}" ]; then
            VERSION="${VERSION_INPUT#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '${VERSION}' is not a valid .NET package version. Use a tag like v0.1.0 or workflow input like 0.1.0."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: dotnet test modules/tests/Minicloud.Cli.Tests/Minicloud.Cli.Tests.csproj --configuration Release

      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish modules/cli/Minicloud.Cli.csproj \
            --configuration Release \
            --runtime "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version="${VERSION}" \
            --output "artifacts/minicloud-${RID}"

          if [[ "${RID}" == win-* ]]; then
            mv "artifacts/minicloud-${RID}/Minicloud.Cli.exe" "artifacts/minicloud-${RID}/minicloud.exe"
          else
            mv "artifacts/minicloud-${RID}/Minicloud.Cli" "artifacts/minicloud-${RID}/minicloud"
            chmod +x "artifacts/minicloud-${RID}/minicloud"
          fi

      - name: Archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "artifacts/minicloud-${RID}" && zip -r "../../dist/minicloud-${RID}.zip" .)
          else
            tar -czf "dist/minicloud-${RID}.tar.gz" -C "artifacts/minicloud-${RID}" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: minicloud-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add checksums and installers
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum minicloud-* > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
