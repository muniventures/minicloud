# SPDX-License-Identifier: MPL-2.0
name: CLI Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            git merge-base --is-ancestor HEAD origin/main
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            archive: tar.gz
            arch: X64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            arch: ARM64
          - rid: osx-arm64
            os: macos-15
            archive: tar.gz
            arch: ARM64
          - rid: win-x64
            os: windows-2025
            archive: zip
            arch: X64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [ "${RUNNER_ARCH}" = "${EXPECTED_ARCH}" ] || {
            echo "Expected ${EXPECTED_ARCH} runner for ${{ matrix.rid }}, found ${RUNNER_ARCH}."
            exit 1
          }

      - name: Test CLI and client contracts
        shell: bash
        run: dotnet test modules/tests/Minicloud.Cli.Tests/Minicloud.Cli.Tests.csproj --configuration Release

      - name: Publish self-contained single-file CLI
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish modules/cli/Minicloud.Cli.csproj \
            --configuration Release \
            --runtime "${RID}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:Version="${VERSION}" \
            --output "artifacts/minicloud-${RID}"

          if [[ "${RID}" == win-* ]]; then
            mv "artifacts/minicloud-${RID}/Minicloud.Cli.exe" "artifacts/minicloud-${RID}/minicloud.exe"
          else
            mv "artifacts/minicloud-${RID}/Minicloud.Cli" "artifacts/minicloud-${RID}/minicloud"
            chmod +x "artifacts/minicloud-${RID}/minicloud"
          fi
          python scripts/package-cli-notices.py "artifacts/minicloud-${RID}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          # Archives must not ship debug symbols.
          find "artifacts/minicloud-${RID}" -iname '*.pdb' -delete

      - name: Verify publish output contains no source/config/debug artifacts
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dir="artifacts/minicloud-${RID}"
          if [[ "${RID}" == win-* ]]; then exe="${dir}/minicloud.exe"; else exe="${dir}/minicloud"; fi
          [ -f "${exe}" ] || { echo "Missing executable ${exe}"; exit 1; }
          if find "${dir}" -iname '*.pdb' -o -iname 'appsettings*.json' -o -iname '*.cs' -o -iname '*.slnx' | grep -q .; then
            echo "Publish output contains source/config/debug artifacts:"
            find "${dir}" -iname '*.pdb' -o -iname 'appsettings*.json' -o -iname '*.cs' -o -iname '*.slnx'
            exit 1
          fi

      - name: Archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${ARCHIVE}" = "zip" ]; then
            python - <<'PYZIP'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          rid = os.environ["RID"]
          root = Path(f"artifacts/minicloud-{rid}")
          with ZipFile(f"dist/minicloud-{rid}.zip", "w", ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
              assert "minicloud.exe" in archive.namelist(), "Archive missing minicloud.exe at root"
          PYZIP
          else
            tar -czf "dist/minicloud-${RID}.tar.gz" -C "artifacts/minicloud-${RID}" .
          fi
          if [[ "${RID}" != win-* ]]; then
            tar -tzf "dist/minicloud-${RID}.tar.gz" | grep -E '^(\./)?minicloud$' >/dev/null || { echo "Archive missing minicloud at root"; exit 1; }
          fi

      - name: Smoke-test executable and mocked API command
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dir="artifacts/minicloud-${RID}"
          if [[ "${RID}" == win-* ]]; then exe="${dir}/minicloud.exe"; else exe="${dir}/minicloud"; fi
          python scripts/verify-cli-release.py "${exe}" "${VERSION}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minicloud-${{ matrix.rid }}
          path: dist/*


  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: minicloud-*
          path: dist
          merge-multiple: true
      - name: Verify release contents
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 osx-arm64; do
            test -f "dist/minicloud-${rid}.tar.gz"
          done
          test -f dist/minicloud-win-x64.zip
          cp install.sh install.ps1 dist/
          test "$(find dist -type f | wc -l)" -eq 6
          (cd dist && sha256sum minicloud-*.tar.gz minicloud-*.zip > checksums.txt)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Verify provenance and publish draft
        run: |
          set -euo pipefail
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF"
          done
          if gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes dist/*
          fi
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 7
          release_flags=()
          if [[ "$TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release edit "$TAG" --draft=false "${release_flags[@]}"
