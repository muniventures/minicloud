# SPDX-License-Identifier: MPL-2.0
name: Minicloud Customer Deploy

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      database:
        required: false
        type: string
        default: sqlite
      minicloud_environment:
        required: false
        type: string
        default: prod
      services:
        required: true
        type: string
      minicloud_version:
        required: false
        type: string
        default: 7416e1408ecd9d11f58c638f0caf1c28e5fa6e3f
      minicloud_api_url:
        description: "HTTPS API origin for a self-hosted Minicloud instance."
        required: false
        type: string
        default: ""
      minicloud_app_domain:
        description: "Generated application hostname suffix for a self-hosted instance."
        required: false
        type: string
        default: ""
    secrets:
      minicloud_api_key:
        required: true
      postgres_password:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Minicloud CLI from verified source
        env:
          MINICLOUD_VERSION: ${{ inputs.minicloud_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MINICLOUD_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            expected_sha="$MINICLOUD_VERSION"
            cli_version="0.0.0-source.sha${MINICLOUD_VERSION:0:12}"
          elif [[ "$MINICLOUD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            tag_ref="refs/tags/$MINICLOUD_VERSION"
            remote_before="$(git ls-remote https://github.com/muniventures/minicloud.git "$tag_ref" "$tag_ref^{}")"
            expected_sha="$(printf '%s\n' "$remote_before" | awk -v ref="$tag_ref" '$2 == ref { tag=$1 } $2 == ref "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print tag }')"
            if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "CLI tag $MINICLOUD_VERSION was not found in the canonical repository." >&2
              exit 1
            fi
            cli_version="${MINICLOUD_VERSION#v}"
          else
            echo "minicloud_version must be a full lowercase commit SHA or exact CLI tag (for example v3.1.0); branches, latest, and server-v tags are not supported." >&2
            exit 1
          fi

          build_root="$(mktemp -d "${RUNNER_TEMP}/minicloud-cli-build.XXXXXX")"
          source_dir="${build_root}/source"
          publish_dir="${build_root}/publish"
          git clone --filter=blob:none --no-tags --single-branch --branch main \
            https://github.com/muniventures/minicloud.git "$source_dir"
          if [[ -n "${tag_ref:-}" ]]; then
            git -C "$source_dir" fetch --no-tags origin "$tag_ref:$tag_ref"
            fetched_sha="$(git -C "$source_dir" rev-parse "$tag_ref^{commit}")"
            remote_after="$(git ls-remote https://github.com/muniventures/minicloud.git "$tag_ref" "$tag_ref^{}")"
            remote_after_sha="$(printf '%s\n' "$remote_after" | awk -v ref="$tag_ref" '$2 == ref { tag=$1 } $2 == ref "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print tag }')"
            if [[ "$fetched_sha" != "$expected_sha" || "$remote_after_sha" != "$expected_sha" ]]; then
              echo "CLI tag $MINICLOUD_VERSION changed while its source was being acquired; retry with a reviewed commit SHA." >&2
              exit 1
            fi
          fi
          if ! git -C "$source_dir" merge-base --is-ancestor "$expected_sha" refs/remotes/origin/main; then
            echo "Selected CLI source $expected_sha is not in canonical main." >&2
            exit 1
          fi
          git -C "$source_dir" checkout --detach "$expected_sha"
          resolved_sha="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$resolved_sha" != "$expected_sha" ]]; then
            echo "Resolved source revision did not match the selected revision." >&2
            exit 1
          fi
          echo "Building Minicloud CLI from muniventures/minicloud at $resolved_sha"
          cd "$source_dir"
          dotnet publish "$source_dir/modules/cli/Minicloud.Cli.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$publish_dir" \
            -p:Version="$cli_version" \
            -p:SourceRevisionId="$resolved_sha" \
            -p:InformationalVersion="$cli_version+sha.$resolved_sha"
          mv "$publish_dir/Minicloud.Cli" "$publish_dir/minicloud"
          python3 "$source_dir/scripts/verify-cli-release.py" "$publish_dir/minicloud" "$cli_version"
          echo "$publish_dir" >> "$GITHUB_PATH"

      - name: Generate Minicloud config
        env:
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          SERVICES_INPUT: ${{ inputs.services }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_ID}" ]; then
            echo "app_id is required. Use the app id from the Minicloud console URL, for example app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          if ! [[ "${APP_ID}" =~ ^app_[A-Za-z0-9]+$ ]]; then
            echo "app_id must look like app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          case "${DATABASE}" in
            sqlite|postgres|none)
              ;;
            *)
              echo "database must be sqlite, postgres, or none."
              exit 1
              ;;
          esac

          ruby -ryaml -e '
            services = YAML.safe_load(ENV.fetch("SERVICES_INPUT"), permitted_classes: [], aliases: false)
            unless services.is_a?(Array) && services.any?
              warn "services must be a non-empty YAML array"
              exit 1
            end

            config = {
              "app" => "github-actions",
              "appId" => ENV.fetch("APP_ID"),
              "database" => ENV.fetch("DATABASE"),
              "commitSha" => ENV.fetch("GITHUB_SHA"),
              "services" => {}
            }

            services.each do |service|
              unless service.is_a?(Hash)
                warn "each service must be a YAML mapping"
                exit 1
              end

              name = service["name"]
              unless name.is_a?(String) && name.match?(/\A[a-z0-9][a-z0-9_-]*\z/)
                warn "service names must use lowercase letters, numbers, dashes, and underscores"
                exit 1
              end

              if config["services"].key?(name)
                warn "service names must be unique"
                exit 1
              end

              known = %w[name sourcePath dockerfile image port public path healthPath env secretEnv buildMode]
              unknown = service.keys - known
              unless unknown.empty?
                warn "services contains unknown service properties: #{unknown.join(", ")}"
                exit 1
              end

              config["services"][name] = service.reject { |key, _| key == "name" }
            end

            File.write("minicloud.yml", YAML.dump(config))
          '

      - name: Deploy with Minicloud CLI
        env:
          MINICLOUD_TOKEN: ${{ secrets.minicloud_api_key }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          MINICLOUD_ENVIRONMENT: ${{ inputs.minicloud_environment }}
          MINICLOUD_APP_DOMAIN: ${{ inputs.minicloud_app_domain }}
          SELF_HOSTED_API_URL: ${{ inputs.minicloud_api_url }}
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/minicloud-config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MINICLOUD_TOKEN}" ]; then
            echo "minicloud_api_key is missing or unavailable in this repository."
            exit 1
          fi
          echo "::add-mask::${MINICLOUD_TOKEN}"

          if [ -n "${POSTGRES_PASSWORD}" ]; then
            echo "::add-mask::${POSTGRES_PASSWORD}"
          fi

          if [[ -n "$SELF_HOSTED_API_URL" ]]; then
            if [[ ! "$SELF_HOSTED_API_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/?$ ]]; then
              echo "minicloud_api_url must be an HTTPS origin." >&2
              exit 1
            fi
            if [[ -z "$MINICLOUD_APP_DOMAIN" ]]; then
              echo "minicloud_app_domain is required for a self-hosted instance." >&2
              exit 1
            fi
            export MINICLOUD_API_URL="$SELF_HOSTED_API_URL"
            MINICLOUD_ENVIRONMENT=self-hosted
          else
            case "${MINICLOUD_ENVIRONMENT}" in
            prod)
              export MINICLOUD_API_URL="https://api.cloud.muni.dev"
              ;;
            staging)
              export MINICLOUD_API_URL="https://api.cloud-dev.muni.dev"
              ;;
            *)
              echo "minicloud_environment must be prod or staging."
              exit 1
              ;;
            esac
          fi

          args=(deploy --all --config minicloud.yml)
          if [ "${DATABASE}" = "postgres" ]; then
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              echo "postgres_password is required when database is postgres."
              exit 1
            fi
            args+=(--pgpassword "${POSTGRES_PASSWORD}")
          fi

          {
            echo "## Minicloud deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| App ID | \`${APP_ID}\` |"
            echo "| Minicloud environment | \`${MINICLOUD_ENVIRONMENT}\` |"
            echo "| Database | \`${DATABASE}\` |"
            echo "| Customer workflow execution | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

          minicloud "${args[@]}"
