name: Municloud Customer Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      plan:
        required: false
        type: string
        default: P0
      environment:
        required: false
        type: string
        default: staging
      aspnetcore_environment:
        required: false
        type: string
        default: ""
      deployment_type:
        required: false
        type: string
        default: backend_frontend
      database:
        required: false
        type: string
        default: sqlite
      municloud_api_url:
        required: false
        type: string
        default: https://cloud.muni.dev/api
      image_tag:
        required: false
        type: string
        default: ""
      frontend_context:
        required: false
        type: string
        default: ./frontend
      frontend_dockerfile:
        required: false
        type: string
        default: ""
      frontend_port:
        required: false
        type: string
        default: "3000"
      frontend_path:
        required: false
        type: string
        default: "/"
      frontend_health_path:
        required: false
        type: string
        default: "/"
      backend_context:
        required: false
        type: string
        default: .
      backend_dockerfile:
        required: false
        type: string
        default: ""
      backend_port:
        required: false
        type: string
        default: "8080"
      backend_path:
        required: false
        type: string
        default: "/api"
      backend_health_path:
        required: false
        type: string
        default: "/health"
    secrets:
      municloud_api_key:
        required: true
      postgres_password:
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      frontend_image_ref: ${{ steps.images.outputs.frontend_image_ref }}
      backend_image_ref: ${{ steps.images.outputs.backend_image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image refs
        id: images
        shell: bash
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG_INPUT:-${GITHUB_SHA}}"
          IMAGE_NAMESPACE="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          FRONTEND_IMAGE_REF=""
          BACKEND_IMAGE_REF=""

          case "${DEPLOYMENT_TYPE}" in
            backend_only)
              BACKEND_IMAGE_REF="${REGISTRY}/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
              ;;
            frontend_only)
              FRONTEND_IMAGE_REF="${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"
              ;;
            backend_frontend)
              FRONTEND_IMAGE_REF="${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"
              BACKEND_IMAGE_REF="${REGISTRY}/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
              ;;
            *)
              echo "deployment_type must be backend_only, frontend_only, or backend_frontend."
              exit 1
              ;;
          esac

          {
            echo "FRONTEND_IMAGE_REF=${FRONTEND_IMAGE_REF}"
            echo "BACKEND_IMAGE_REF=${BACKEND_IMAGE_REF}"
          } >> "${GITHUB_ENV}"

          {
            echo "frontend_image_ref=${FRONTEND_IMAGE_REF}"
            echo "backend_image_ref=${BACKEND_IMAGE_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build frontend image
        if: inputs.deployment_type == 'frontend_only' || inputs.deployment_type == 'backend_frontend'
        shell: bash
        env:
          FRONTEND_CONTEXT: ${{ inputs.frontend_context }}
          FRONTEND_DOCKERFILE: ${{ inputs.frontend_dockerfile }}
        run: |
          set -euo pipefail

          args=(docker buildx build --platform linux/amd64 --load -t "${FRONTEND_IMAGE_REF}")
          if [ -n "${FRONTEND_DOCKERFILE}" ]; then
            args+=(-f "${FRONTEND_DOCKERFILE}")
          fi
          args+=("${FRONTEND_CONTEXT}")
          "${args[@]}"
          docker save "${FRONTEND_IMAGE_REF}" -o frontend-image.tar

      - name: Build backend image
        if: inputs.deployment_type == 'backend_only' || inputs.deployment_type == 'backend_frontend'
        shell: bash
        env:
          BACKEND_CONTEXT: ${{ inputs.backend_context }}
          BACKEND_DOCKERFILE: ${{ inputs.backend_dockerfile }}
        run: |
          set -euo pipefail

          args=(docker buildx build --platform linux/amd64 --load -t "${BACKEND_IMAGE_REF}")
          if [ -n "${BACKEND_DOCKERFILE}" ]; then
            args+=(-f "${BACKEND_DOCKERFILE}")
          fi
          args+=("${BACKEND_CONTEXT}")
          "${args[@]}"
          docker save "${BACKEND_IMAGE_REF}" -o backend-image.tar

      - name: Upload frontend image artifact
        if: inputs.deployment_type == 'frontend_only' || inputs.deployment_type == 'backend_frontend'
        uses: actions/upload-artifact@v4
        with:
          name: municloud-frontend-image
          path: frontend-image.tar
          retention-days: 1

      - name: Upload backend image artifact
        if: inputs.deployment_type == 'backend_only' || inputs.deployment_type == 'backend_frontend'
        uses: actions/upload-artifact@v4
        with:
          name: municloud-backend-image
          path: backend-image.tar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.payload.outputs.services_json }}
    steps:
      - name: Download frontend image artifact
        if: inputs.deployment_type == 'frontend_only' || inputs.deployment_type == 'backend_frontend'
        uses: actions/download-artifact@v4
        with:
          name: municloud-frontend-image

      - name: Download backend image artifact
        if: inputs.deployment_type == 'backend_only' || inputs.deployment_type == 'backend_frontend'
        uses: actions/download-artifact@v4
        with:
          name: municloud-backend-image

      - name: Publish images
        env:
          FRONTEND_IMAGE_REF: ${{ needs.build.outputs.frontend_image_ref }}
          BACKEND_IMAGE_REF: ${{ needs.build.outputs.backend_image_ref }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          if [ -n "${FRONTEND_IMAGE_REF}" ]; then
            docker load -i frontend-image.tar
            docker push "${FRONTEND_IMAGE_REF}"
          fi

          if [ -n "${BACKEND_IMAGE_REF}" ]; then
            docker load -i backend-image.tar
            docker push "${BACKEND_IMAGE_REF}"
          fi

      - name: Build Municloud service payload
        id: payload
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          FRONTEND_IMAGE_REF: ${{ needs.build.outputs.frontend_image_ref }}
          BACKEND_IMAGE_REF: ${{ needs.build.outputs.backend_image_ref }}
          ASPNETCORE_ENVIRONMENT_INPUT: ${{ inputs.aspnetcore_environment }}
          FRONTEND_PORT: ${{ inputs.frontend_port }}
          FRONTEND_PATH: ${{ inputs.frontend_path }}
          FRONTEND_HEALTH_PATH: ${{ inputs.frontend_health_path }}
          BACKEND_PORT: ${{ inputs.backend_port }}
          BACKEND_PATH: ${{ inputs.backend_path }}
          BACKEND_HEALTH_PATH: ${{ inputs.backend_health_path }}
        shell: bash
        run: |
          set -euo pipefail

          case "${DEPLOYMENT_TYPE}" in
            backend_only)
              jq -c -n \
                --arg backend_image "${BACKEND_IMAGE_REF}" \
                --argjson backend_port "${BACKEND_PORT}" \
                --arg backend_path "${BACKEND_PATH}" \
                --arg backend_health_path "${BACKEND_HEALTH_PATH}" \
                --arg aspnetcore_environment "${ASPNETCORE_ENVIRONMENT_INPUT}" \
                '[{
                  name: "backend",
                  image: $backend_image,
                  port: $backend_port,
                  public: true,
                  path: $backend_path,
                  health_path: $backend_health_path,
                  env: (if $aspnetcore_environment == "" then {} else { ASPNETCORE_ENVIRONMENT: $aspnetcore_environment } end)
                }]' > municloud-services.json
              ;;
            frontend_only)
              jq -c -n \
                --arg frontend_image "${FRONTEND_IMAGE_REF}" \
                --argjson frontend_port "${FRONTEND_PORT}" \
                --arg frontend_path "${FRONTEND_PATH}" \
                --arg frontend_health_path "${FRONTEND_HEALTH_PATH}" \
                '[{
                  name: "frontend",
                  image: $frontend_image,
                  port: $frontend_port,
                  public: true,
                  path: $frontend_path,
                  health_path: $frontend_health_path
                }]' > municloud-services.json
              ;;
            backend_frontend)
              jq -c -n \
                --arg frontend_image "${FRONTEND_IMAGE_REF}" \
                --arg backend_image "${BACKEND_IMAGE_REF}" \
                --argjson frontend_port "${FRONTEND_PORT}" \
                --argjson backend_port "${BACKEND_PORT}" \
                --arg frontend_path "${FRONTEND_PATH}" \
                --arg backend_path "${BACKEND_PATH}" \
                --arg frontend_health_path "${FRONTEND_HEALTH_PATH}" \
                --arg backend_health_path "${BACKEND_HEALTH_PATH}" \
                --arg aspnetcore_environment "${ASPNETCORE_ENVIRONMENT_INPUT}" \
                '[
                  {
                    name: "frontend",
                    image: $frontend_image,
                    port: $frontend_port,
                    public: true,
                    path: $frontend_path,
                    health_path: $frontend_health_path
                  },
                  {
                    name: "backend",
                    image: $backend_image,
                    port: $backend_port,
                    public: true,
                    path: $backend_path,
                    health_path: $backend_health_path,
                    env: (if $aspnetcore_environment == "" then {} else { ASPNETCORE_ENVIRONMENT: $aspnetcore_environment } end)
                  }
                ]' > municloud-services.json
              ;;
          esac

          SERVICES_JSON="$(cat municloud-services.json)"
          echo "services_json=${SERVICES_JSON}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Request Municloud deploy
        id: deploy
        env:
          MUNICLOUD_API_KEY: ${{ secrets.municloud_api_key }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          SERVICES_JSON: ${{ needs.publish.outputs.services_json }}
          MUNICLOUD_API_URL: ${{ inputs.municloud_api_url }}
          APP_NAME: ${{ inputs.app_name }}
          PLAN: ${{ inputs.plan }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
          DATABASE: ${{ inputs.database }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MUNICLOUD_API_KEY}" ]; then
            echo "municloud_api_key is missing or unavailable in this repository."
            exit 1
          fi
          echo "::add-mask::${MUNICLOUD_API_KEY}"

          if [ "${DATABASE}" = "postgres" ] && [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "postgres_password is required when database is postgres."
            exit 1
          fi

          MUNICLOUD_API_URL="${MUNICLOUD_API_URL%/}"

          api_get() {
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${MUNICLOUD_API_KEY}" \
              -H "Accept: application/json" \
              "$1"
          }

          api_post() {
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${MUNICLOUD_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "$2" \
              "$1"
          }

          ME_JSON="$(api_get "${MUNICLOUD_API_URL}/v1/me")"
          ORGANIZATION_ID="$(printf '%s' "${ME_JSON}" | jq -r '.organizations[0].id // ""')"
          ORGANIZATION_SLUG="$(printf '%s' "${ME_JSON}" | jq -r '.organizations[0].slug // ""')"
          if [ -z "${ORGANIZATION_ID}" ]; then
            echo "Municloud API key is not associated with an organization."
            exit 1
          fi

          APP_SLUG="$(printf '%s' "${APP_NAME}" | tr '[:upper:]' '[:lower:]')"
          APPS_JSON="$(api_get "${MUNICLOUD_API_URL}/v1/apps?organizationId=${ORGANIZATION_ID}")"
          APP_ID="$(printf '%s' "${APPS_JSON}" | jq -r --arg app "${APP_SLUG}" '.[] | select((.slug | ascii_downcase) == $app or (.id | ascii_downcase) == $app) | .id' | head -n 1)"

          if [ -z "${APP_ID}" ]; then
            CREATE_APP_JSON="$(
              jq -cn \
                --arg organization_id "${ORGANIZATION_ID}" \
                --arg name "${APP_NAME}" \
                --arg slug "${APP_SLUG}" \
                --arg environment "${ENVIRONMENT}" \
                --arg plan "${PLAN}" \
                --arg deployment_type "${DEPLOYMENT_TYPE}" \
                --arg database "${DATABASE}" \
                '{
                  organizationId: $organization_id,
                  name: $name,
                  slug: $slug,
                  defaultEnvironment: $environment,
                  plan: ($plan | ascii_downcase),
                  deploymentType: $deployment_type,
                  database: $database
                }'
            )"
            APP_JSON="$(api_post "${MUNICLOUD_API_URL}/v1/apps" "${CREATE_APP_JSON}")"
            APP_ID="$(printf '%s' "${APP_JSON}" | jq -r '.id')"
            echo "Created Municloud app ${APP_ID} in ${ORGANIZATION_SLUG}."
          fi

          SERVICES_FOR_API="$(
            printf '%s' "${SERVICES_JSON}" | jq -c '[.[] | {
              name,
              image,
              port,
              public,
              path,
              healthPath: .health_path,
              env: (.env // null)
            }]'
          )"

          DEPLOYMENT_JSON="$(
            jq -cn \
              --arg app_id "${APP_ID}" \
              --arg environment "${ENVIRONMENT}" \
              --arg deployment_type "${DEPLOYMENT_TYPE}" \
              --arg database "${DATABASE}" \
              --arg commit_sha "${GITHUB_SHA}" \
              --arg postgres_password "${POSTGRES_PASSWORD}" \
              --argjson services "${SERVICES_FOR_API}" \
              '{
                appId: $app_id,
                environment: $environment,
                deploymentType: $deployment_type,
                database: $database,
                commitSha: $commit_sha,
                services: $services,
                postgresPassword: (if $postgres_password == "" then null else $postgres_password end)
              }'
          )"

          CREATED_JSON="$(api_post "${MUNICLOUD_API_URL}/v1/deployments" "${DEPLOYMENT_JSON}")"
          DEPLOYMENT_ID="$(printf '%s' "${CREATED_JSON}" | jq -r '.id')"
          STATUS="$(printf '%s' "${CREATED_JSON}" | jq -r '.status')"
          WEBSITE_URL="$(printf '%s' "${CREATED_JSON}" | jq -r '.websiteUrl // ""')"
          echo "Municloud deployment: ${DEPLOYMENT_ID}"
          echo "Status: ${STATUS}"

          LAST_STATUS="${STATUS}"
          for attempt in $(seq 1 240); do
            DEPLOYMENT_JSON="$(api_post "${MUNICLOUD_API_URL}/v1/deployments/${DEPLOYMENT_ID}/refresh" "{}")"
            STATUS="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.status')"
            WEBSITE_URL="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.websiteUrl // ""')"
            CONSOLE_URL="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.consoleUrl // ""')"

            if [ "${STATUS}" != "${LAST_STATUS}" ]; then
              echo "Status: ${STATUS}"
              LAST_STATUS="${STATUS}"
            fi

            case "${STATUS}" in
              succeeded)
                echo "Website URL: ${WEBSITE_URL}"
                {
                  echo "## Municloud deployment"
                  echo ""
                  echo "- Deployment: ${DEPLOYMENT_ID}"
                  echo "- Website URL: ${WEBSITE_URL}"
                  echo "- Console: ${CONSOLE_URL}"
                } >> "${GITHUB_STEP_SUMMARY}"
                exit 0
                ;;
              failed|canceled)
                FAILURE_CODE="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.failureCode // .status')"
                FAILURE_MESSAGE="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.failureMessage // ""')"
                echo "Municloud deployment ${STATUS}: ${FAILURE_CODE}"
                if [ -n "${FAILURE_MESSAGE}" ]; then
                  echo "Message: ${FAILURE_MESSAGE}"
                fi
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Timed out waiting for Municloud deployment to complete."
          echo "Deployment: ${DEPLOYMENT_ID}"
          exit 1
