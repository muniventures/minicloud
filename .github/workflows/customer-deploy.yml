# SPDX-License-Identifier: MPL-2.0
name: Minicloud Customer Deploy

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      database:
        required: false
        type: string
        default: sqlite
      minicloud_environment:
        required: false
        type: string
        default: prod
      services:
        required: true
        type: string
      minicloud_version:
        required: false
        type: string
        default: latest
      minicloud_api_url:
        description: "HTTPS API origin for a self-hosted Minicloud instance."
        required: false
        type: string
        default: ""
    secrets:
      minicloud_api_key:
        required: true
      postgres_password:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Minicloud CLI
        env:
          MINICLOUD_VERSION: ${{ inputs.minicloud_version }}
          MINICLOUD_INSTALL_DIR: ${{ runner.temp }}/minicloud-bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MINICLOUD_INSTALL_DIR}"
          base=https://github.com/muniventures/minicloud/releases
          if [[ "$MINICLOUD_VERSION" == latest ]]; then
            base="$base/latest/download"
          elif [[ "$MINICLOUD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            base="$base/download/$MINICLOUD_VERSION"
          else
            echo "minicloud_version must be latest or a release tag such as v2.1.1." >&2
            exit 1
          fi
          archive=minicloud-linux-x64.tar.gz
          cd "${MINICLOUD_INSTALL_DIR}"
          curl -fsSL "$base/$archive" -o "$archive"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          awk -v asset="$archive" '$2 == asset && $1 ~ /^[a-fA-F0-9]+$/ && length($1) == 64 { print $1 "  " asset; found++ } END { exit(found != 1) }' checksums.txt > checksum
          sha256sum -c checksum
          tar -xzf "$archive"
          test -x minicloud
          echo "${MINICLOUD_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Generate Minicloud config
        env:
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          SERVICES_INPUT: ${{ inputs.services }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_ID}" ]; then
            echo "app_id is required. Use the app id from the Minicloud console URL, for example app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          if ! [[ "${APP_ID}" =~ ^app_[A-Za-z0-9]+$ ]]; then
            echo "app_id must look like app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          case "${DATABASE}" in
            sqlite|postgres|none)
              ;;
            *)
              echo "database must be sqlite, postgres, or none."
              exit 1
              ;;
          esac

          ruby -ryaml -e '
            services = YAML.safe_load(ENV.fetch("SERVICES_INPUT"), permitted_classes: [], aliases: false)
            unless services.is_a?(Array) && services.any?
              warn "services must be a non-empty YAML array"
              exit 1
            end

            config = {
              "app" => "github-actions",
              "appId" => ENV.fetch("APP_ID"),
              "database" => ENV.fetch("DATABASE"),
              "commitSha" => ENV.fetch("GITHUB_SHA"),
              "services" => {}
            }

            services.each do |service|
              unless service.is_a?(Hash)
                warn "each service must be a YAML mapping"
                exit 1
              end

              name = service["name"]
              unless name.is_a?(String) && name.match?(/\A[a-z0-9][a-z0-9_-]*\z/)
                warn "service names must use lowercase letters, numbers, dashes, and underscores"
                exit 1
              end

              if config["services"].key?(name)
                warn "service names must be unique"
                exit 1
              end

              known = %w[name sourcePath dockerfile image port public path healthPath env secretEnv buildMode]
              unknown = service.keys - known
              unless unknown.empty?
                warn "services contains unknown service properties: #{unknown.join(", ")}"
                exit 1
              end

              config["services"][name] = service.reject { |key, _| key == "name" }
            end

            File.write("minicloud.yml", YAML.dump(config))
          '

      - name: Deploy with Minicloud CLI
        env:
          MINICLOUD_TOKEN: ${{ secrets.minicloud_api_key }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          MINICLOUD_ENVIRONMENT: ${{ inputs.minicloud_environment }}
          SELF_HOSTED_API_URL: ${{ inputs.minicloud_api_url }}
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/minicloud-config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MINICLOUD_TOKEN}" ]; then
            echo "minicloud_api_key is missing or unavailable in this repository."
            exit 1
          fi
          echo "::add-mask::${MINICLOUD_TOKEN}"

          if [ -n "${POSTGRES_PASSWORD}" ]; then
            echo "::add-mask::${POSTGRES_PASSWORD}"
          fi

          if [[ -n "$SELF_HOSTED_API_URL" ]]; then
            if [[ ! "$SELF_HOSTED_API_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/?$ ]]; then
              echo "minicloud_api_url must be an HTTPS origin." >&2
              exit 1
            fi
            export MINICLOUD_API_URL="$SELF_HOSTED_API_URL"
            MINICLOUD_ENVIRONMENT=self-hosted
          else
            case "${MINICLOUD_ENVIRONMENT}" in
            prod)
              export MINICLOUD_API_URL="https://api.cloud.muni.dev"
              ;;
            staging)
              export MINICLOUD_API_URL="https://api.cloud-dev.muni.dev"
              ;;
            *)
              echo "minicloud_environment must be prod or staging."
              exit 1
              ;;
            esac
          fi

          args=(deploy --all --config minicloud.yml)
          if [ "${DATABASE}" = "postgres" ]; then
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              echo "postgres_password is required when database is postgres."
              exit 1
            fi
            args+=(--pgpassword "${POSTGRES_PASSWORD}")
          fi

          {
            echo "## Minicloud deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| App ID | \`${APP_ID}\` |"
            echo "| Minicloud environment | \`${MINICLOUD_ENVIRONMENT}\` |"
            echo "| Database | \`${DATABASE}\` |"
            echo "| Customer workflow execution | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

          minicloud "${args[@]}"
