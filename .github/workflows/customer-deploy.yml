name: Minicloud Customer Deploy

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      database:
        required: false
        type: string
        default: sqlite
      minicloud_environment:
        required: false
        type: string
        default: prod
      services:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: ""
    secrets:
      minicloud_api_key:
        required: true
      postgres_password:
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    outputs:
      services_json: ${{ steps.payload.outputs.services_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish service images
        id: payload
        env:
          SERVICES_INPUT: ${{ inputs.services }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG_INPUT:-${GITHUB_SHA}}"
          IMAGE_NAMESPACE="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          services="$(
            printf '%s' "${SERVICES_INPUT}" | ruby -ryaml -rjson -e '
              services = YAML.safe_load($stdin.read, permitted_classes: [], aliases: false)
              unless services.is_a?(Array)
                warn "services must be a YAML array"
                exit 1
              end

              unless services.all? { |service| service.is_a?(Hash) }
                warn "each service must be a YAML mapping"
                exit 1
              end

              puts JSON.generate(services)
            '
          )"

          printf '%s' "${services}" | jq -e '
            def valid_name: test("^[a-z0-9_-]+$");
            def valid_env_key: test("^[A-Za-z_][A-Za-z0-9_]*$");
            def known_service_keys: ["name", "sourcePath", "dockerfile", "image", "port", "public", "path", "healthPath", "env"];

            if length < 1 then
              error("services must include at least one service")
            elif length > 5 then
              error("services supports at most five services")
            elif any(.[]; (keys - known_service_keys) | length > 0) then
              error("services contains unknown service properties")
            elif ([.[].name] | unique | length) != length then
              error("service names must be unique")
            elif any(.[]; (.name | type) != "string" or (.name | valid_name | not)) then
              error("service names must use lowercase letters, numbers, dashes, and underscores")
            elif any(.[]; ((.image // "") == "" and (.sourcePath // "") == "")) then
              error("each service must include image or sourcePath")
            elif any(.[]; (.port | tonumber? // 0) < 1 or (.port | tonumber? // 0) > 65535) then
              error("service port must be between 1 and 65535")
            elif any(.[]; (.public | type) != "boolean") then
              error("service public must be true or false")
            elif any(.[]; (.path | type) != "string" or (.path | startswith("/") | not)) then
              error("service path must start with /")
            elif any(.[]; (.healthPath | type) != "string" or (.healthPath | startswith("/") | not)) then
              error("service healthPath must start with /")
            elif ([.[] | select(.public)] | length) == 0 then
              error("at least one public service is required")
            elif any(.[]; (.env? != null) and ((.env | type) != "object")) then
              error("service env must be an object")
            elif any(.[]; (.env? // {}) | to_entries | any(.[]; (.key | valid_env_key | not) or ((.value | type) != "string"))) then
              error("service env keys must be valid environment variable names and values must be strings")
            else
              true
            end
          ' >/dev/null

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          services_count="$(printf '%s' "${services}" | jq 'length')"
          published='[]'

          for index in $(seq 0 "$((services_count - 1))"); do
            service="$(printf '%s' "${services}" | jq -c --argjson index "${index}" '.[$index]')"
            name="$(printf '%s' "${service}" | jq -r '.name')"
            source_path="$(printf '%s' "${service}" | jq -r '.sourcePath // ""')"
            dockerfile="$(printf '%s' "${service}" | jq -r '.dockerfile // ""')"
            image="$(printf '%s' "${service}" | jq -r '.image // ""')"

            if [ -n "${source_path}" ]; then
              if [ -z "${image}" ]; then
                image="${REGISTRY}/${IMAGE_NAMESPACE}/${name}:${IMAGE_TAG}"
              fi

              args=(docker buildx build --platform linux/amd64 --load -t "${image}")
              if [ -n "${dockerfile}" ]; then
                args+=(-f "${dockerfile}")
              fi
              args+=("${source_path}")

              "${args[@]}"
              docker push "${image}"
            fi

            service="$(
              printf '%s' "${service}" | jq -c \
                --arg image "${image}" \
                '{
                  name,
                  image: $image,
                  port: (.port | tonumber),
                  public,
                  path,
                  health_path: .healthPath,
                  env: (.env // null)
                }'
            )"
            published="$(jq -cn --argjson services "${published}" --argjson service "${service}" '$services + [$service]')"
          done

          printf '%s' "${published}" > minicloud-services.json
          printf 'services_json=%s\n' "${published}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Request Minicloud deploy
        id: deploy
        env:
          MINICLOUD_API_KEY: ${{ secrets.minicloud_api_key }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          SERVICES_JSON: ${{ needs.publish.outputs.services_json }}
          MINICLOUD_ENVIRONMENT: ${{ inputs.minicloud_environment }}
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MINICLOUD_API_KEY}" ]; then
            echo "minicloud_api_key is missing or unavailable in this repository."
            exit 1
          fi
          echo "::add-mask::${MINICLOUD_API_KEY}"

          if [ -z "${APP_ID}" ]; then
            echo "app_id is required. Use the app id from the Minicloud console URL, for example app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          if ! [[ "${APP_ID}" =~ ^app_[A-Za-z0-9]+$ ]]; then
            echo "app_id must look like app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          if [ "${DATABASE}" = "postgres" ] && [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "postgres_password is required when database is postgres."
            exit 1
          fi

          case "${MINICLOUD_ENVIRONMENT}" in
            prod)
              MINICLOUD_API_URL="https://cloud.muni.dev/api"
              ;;
            staging)
              MINICLOUD_API_URL="https://minicloud-dev.muni.dev/api"
              ;;
            *)
              echo "minicloud_environment must be prod or staging."
              exit 1
              ;;
          esac

          api_post() {
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer ${MINICLOUD_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data-binary "$2" \
              "$1"
          }

          SERVICES_FOR_API="$(
            printf '%s' "${SERVICES_JSON}" | jq -c '[.[] | {
              name,
              image,
              port,
              public,
              path,
              healthPath: .health_path,
              env: (.env // null)
            }]'
          )"

          DEPLOYMENT_JSON="$(
            jq -cn \
              --arg app_id "${APP_ID}" \
              --arg database "${DATABASE}" \
              --arg commit_sha "${GITHUB_SHA}" \
              --arg postgres_password "${POSTGRES_PASSWORD}" \
              --argjson services "${SERVICES_FOR_API}" \
              '{
                appId: $app_id,
                database: $database,
                commitSha: $commit_sha,
                services: $services,
                postgresPassword: (if $postgres_password == "" then null else $postgres_password end)
              }'
          )"

          CREATED_JSON="$(api_post "${MINICLOUD_API_URL}/v1/deployments" "${DEPLOYMENT_JSON}")"
          DEPLOYMENT_ID="$(printf '%s' "${CREATED_JSON}" | jq -r '.id')"
          STATUS="$(printf '%s' "${CREATED_JSON}" | jq -r '.status')"
          WEBSITE_URL="$(printf '%s' "${CREATED_JSON}" | jq -r '.websiteUrl // ""')"
          echo "Minicloud deployment: ${DEPLOYMENT_ID}"
          echo "Status: ${STATUS}"

          LAST_STATUS="${STATUS}"
          for attempt in $(seq 1 240); do
            DEPLOYMENT_JSON="$(api_post "${MINICLOUD_API_URL}/v1/deployments/${DEPLOYMENT_ID}/refresh" "{}")"
            STATUS="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.status')"
            WEBSITE_URL="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.websiteUrl // ""')"
            CONSOLE_URL="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.consoleUrl // ""')"

            if [ "${STATUS}" != "${LAST_STATUS}" ]; then
              echo "Status: ${STATUS}"
              LAST_STATUS="${STATUS}"
            fi

            case "${STATUS}" in
              succeeded)
                echo "Website URL: ${WEBSITE_URL}"
                {
                  echo "## Minicloud deployment"
                  echo ""
                  echo "- Deployment: ${DEPLOYMENT_ID}"
                  echo "- Website URL: ${WEBSITE_URL}"
                  echo "- Console: ${CONSOLE_URL}"
                } >> "${GITHUB_STEP_SUMMARY}"
                exit 0
                ;;
              failed|canceled)
                FAILURE_CODE="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.failureCode // .status')"
                FAILURE_MESSAGE="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r '.failureMessage // ""')"
                echo "Minicloud deployment ${STATUS}: ${FAILURE_CODE}"
                if [ -n "${FAILURE_MESSAGE}" ]; then
                  echo "Message: ${FAILURE_MESSAGE}"
                fi
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Timed out waiting for Minicloud deployment to complete."
          echo "Deployment: ${DEPLOYMENT_ID}"
          exit 1
