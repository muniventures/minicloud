services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minicloud
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?}
      POSTGRES_DB: minicloud_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicloud -d minicloud_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  openbao:
    image: openbao/openbao:2.2.1
    cap_add: [IPC_LOCK]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${TEST_BAO_TOKEN:?}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ../../../..
      dockerfile: modules/api/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      openbao: {condition: service_healthy}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Firebase__ProjectId: minicloud-test
      Database__Provider: Postgres
      Database__RunMigrationsOnStartup: "true"
      ConnectionStrings__Minicloud: Host=postgres;Port=5432;Database=minicloud_test;Username=minicloud;Password=${TEST_POSTGRES_PASSWORD:?}
      OpenBao__Address: http://openbao:8200
      OpenBao__Token: ${TEST_BAO_TOKEN:?}

  worker:
    build:
      context: ../../../..
      dockerfile: modules/worker/Dockerfile
    depends_on:
      api: {condition: service_started}
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Minicloud: Host=postgres;Port=5432;Database=minicloud_test;Username=minicloud;Password=${TEST_POSTGRES_PASSWORD:?}
      Worker__PollingInterval: 00:00:01
      Hetzner__ApiToken: component-test-token
      Hetzner__BaseUrl: http://postgres:5432/
      OpenBao__Address: http://openbao:8200
      OpenBao__Token: ${TEST_BAO_TOKEN:?}

networks:
  default:
    internal: true
